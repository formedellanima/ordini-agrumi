# Pubblica la cartella "sito" su GitHub Pages.
# La configurazione di Firebase non è nel codice: viene letta dalle variabili del repository
# (Settings → Secrets and variables → Actions → scheda Variables) e scritta in sito/config.js
# solo nella copia pubblicata.
name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Crea config.js dalle variabili
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          # Facoltativa: accessi esterni per il gestore, separati da virgola (apple, google).
          ACCESSO_GESTORE: ${{ vars.ACCESSO_GESTORE }}
        run: |
          mancanti=""
          for v in FIREBASE_API_KEY FIREBASE_PROJECT_ID FIREBASE_APP_ID; do
            [ -n "${!v}" ] || mancanti="$mancanti $v"
          done
          if [ -n "$mancanti" ]; then
            echo "::error::Mancano le variabili del repository:$mancanti (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          AUTH_DOMAIN="${FIREBASE_AUTH_DOMAIN:-$FIREBASE_PROJECT_ID.firebaseapp.com}"
          jq -n \
            --arg apiKey "$FIREBASE_API_KEY" \
            --arg authDomain "$AUTH_DOMAIN" \
            --arg projectId "$FIREBASE_PROJECT_ID" \
            --arg appId "$FIREBASE_APP_ID" \
            --arg accesso "${ACCESSO_GESTORE:-}" \
            '{apiKey:$apiKey, authDomain:$authDomain, projectId:$projectId, appId:$appId,
              accesso:($accesso | ascii_downcase | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)))}' \
            | { printf 'window.APP_CONFIG = '; cat; printf ';\n'; } > sito/config.js
          echo "config.js creato per il progetto $FIREBASE_PROJECT_ID"

      - name: Segna la versione (l'app aperta si aggiorna da sola)
        run: |
          V="${GITHUB_SHA::12}"
          echo "$V" > sito/versione.txt
          sed -i "s/const VERSIONE = 'sviluppo';/const VERSIONE = '$V';/" sito/index.html
          sed -i "s/ordini-agrumi-v1/ordini-agrumi-$V/" sito/sw.js
          grep -q "const VERSIONE = '$V';" sito/index.html || { echo "::error::Versione non inserita in index.html"; exit 1; }

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sito
      - id: deploy
        uses: actions/deploy-pages@v5
