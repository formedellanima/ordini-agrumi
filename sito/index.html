<script>
(() => {
const CFG = window.APP_CONFIG || {};
const COLS = ['prodotti','ordinazioni','membri','prenotazioni'];
const COLDEF = {
  prodotti:['id','nome','categoria','unita','pp','pf'],
  ordinazioni:['id','titolo','chiusura','consegna','note','stato','prodotti'],
  membri:['id','nome','telefono','note'],
  prenotazioni:['id','ord_id','membro_id','nome','telefono','righe','nota','pagato','consegnato','origine','letta','created_at'],
};
const S = {prodotti:new Map(), ordinazioni:new Map(), membri:new Map(), prenotazioni:new Map()};
const SET = {};
let user = null, phase = 'loading', live = false, ordTab = 'prenotazioni', ordFilter = 'tutte', loginErr = '';

/* ---------- utility ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EUR = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});
const fmtE = n => EUR.format(n || 0);
const fmtQ = n => (Math.round((n||0)*100)/100).toLocaleString('it-IT');
const num = v => { const n = parseFloat(String(v ?? '').replace(',','.')); return isFinite(n) ? n : 0; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2,9));
const pad = n => String(n).padStart(2,'0');
const toLocalDT = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtIn = n => (n === undefined || n === null || n === '') ? '' : String(n).replace('.', ',');
const CAT = {agrumi:'Agrumi bio', fda:"Forme dell'Anima"};
const CAT_MSG = {agrumi:'🍊 Agrumi biologici', fda:"🌿 Forme dell'Anima"};
const STATO = {aperta:'Aperta', chiusa:'Prenotazioni chiuse', consegnata:'Consegnata'};
const fmtDT = s => s ? new Date(s).toLocaleString('it-IT',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '—';
const fmtDTlong = s => s ? new Date(s).toLocaleString('it-IT',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}) : '—';
const fmtD = s => s ? new Date(s+'T12:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'}) : '—';
const fmtDlong = s => s ? new Date(s+'T12:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}) : '';
const fmtAgo = s => { if (!s) return ''; const m = Math.round((Date.now() - new Date(s))/6e4); if (m < 1) return 'adesso'; if (m < 60) return `${m} min fa`; if (m < 1440) return `${Math.round(m/60)} h fa`; return fmtDT(s); };
function countdown(s){
  const ms = new Date(s) - Date.now();
  if (!s || ms <= 0) return 'termine scaduto';
  const h = Math.floor(ms/3.6e6);
  if (h < 1) return `chiude tra ${Math.max(1,Math.ceil(ms/6e4))} min`;
  if (h < 48) return `chiude tra ${h} ore`;
  return `chiude tra ${Math.floor(h/24)} giorni`;
}
const linkOrdina = id => { const u = new URL('ordina.html', location.href); u.hash = ''; u.search = id ? '?o=' + encodeURIComponent(id) : ''; return u.href; };
const linkStato = id => { const u = new URL('stato.html', location.href); u.hash = ''; u.search = '?p=' + encodeURIComponent(id); return u.href; };
const appUrl = () => { const u = new URL(location.href); u.hash = ''; u.search = ''; return u.href; };
const ICON = {
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>',
  ord:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l-1.5 12a2 2 0 0 1-2 1.8h-9a2 2 0 0 1-2-1.8z"/><path d="M8 7a4 4 0 0 1 8 0"/></svg>',
  prod:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 5c1-2 4-3 6-2-1 2-4 3-6 2z" stroke-linejoin="round"/></svg>',
  mem:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.5a6.5 6.5 0 0 1 3 5.5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.5z"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
};

/* ---------- dati (Firebase / Firestore) ---------- */
const FB = 'https://www.gstatic.com/firebasejs/12.4.0/';
let fs = null, fa = null, db = null, auth = null, unsubs = [];
const dref = (c, id) => fs.doc(db, c, id);
function fix(c, r){
  if (r.created_at && typeof r.created_at.toDate === 'function') r = {...r, created_at:r.created_at.toDate().toISOString()};
  if (c === 'prodotti') return {...r, pp:num(r.pp), pf:num(r.pf)};
  if (c === 'ordinazioni') return {...r, consegna:r.consegna||'', note:r.note||'', prodotti:(r.prodotti||[]).map(p => ({...p, pp:num(p.pp), pf:num(p.pf)}))};
  return r;
}
function pick(c, row){
  const o = {}; for (const k of COLDEF[c]) if (row[k] !== undefined) o[k] = row[k];
  return JSON.parse(JSON.stringify(o));
}
function errMsg(e){
  const m = String(e?.code || '') + ' ' + String(e?.message || e || '');
  if (/permission-denied|insufficient permissions/i.test(m)) return 'Questo account non può modificare i dati.';
  if (/unauthenticated/i.test(m)) return 'Sessione scaduta: esci e rientra.';
  if (/unavailable|network|offline|Failed to fetch/i.test(m)) return 'Nessuna connessione: riprova tra poco.';
  return 'Salvataggio non riuscito: ' + m.trim();
}
// Copia pubblica dell'ordinazione (senza prezzi FdA) letta dalla pagina dei clienti.
function pubDoc(o){
  const prodotti = (o.prodotti||[]).map(p => ({pid:p.pid, nome:p.nome, categoria:p.categoria, unita:p.unita, pp:num(p.pp)}));
  return {titolo:o.titolo||'', chiusura:fs.Timestamp.fromDate(new Date(o.chiusura)), consegna:o.consegna||'', note:o.note||'',
    aperta:o.stato === 'aperta', stato:o.stato || 'aperta', prodotti, pids:prodotti.map(p => p.pid),
    avvisi:window.Notifiche ? Notifiche.pubblici(SET.notifiche) : [], app_url:SET.app_url||appUrl()};
}
// Se una scrittura fallisce, Firestore annulla la modifica locale e l'ascolto in tempo reale riporta i dati giusti.
async function put(c, id, data){
  const row = fix(c, {...S[c].get(id), ...data, id});
  S[c].set(id, row); render();
  try {
    const b = fs.writeBatch(db);
    b.set(dref(c, id), pick(c, row));
    if (c === 'ordinazioni') b.set(dref('pubbliche', id), pubDoc(row));
    await b.commit();
  } catch (e) { toast(errMsg(e), true); }
}
async function del(c, id, prenIds = []){
  S[c].delete(id); render();
  try {
    const b = fs.writeBatch(db);
    b.delete(dref(c, id));
    if (c === 'ordinazioni') { b.delete(dref('pubbliche', id)); for (const pid of prenIds) b.delete(dref('prenotazioni', pid)); }
    await b.commit();
  } catch (e) { toast(errMsg(e), true); }
}
async function saveSetting(k, v){
  SET[k] = v;
  try { await fs.setDoc(dref('impostazioni', 'generale'), {[k]:v}, {merge:true}); }
  catch (e) { toast(errMsg(e), true); }
}
async function syncPubbliche(){
  const list = [...S.ordinazioni.values()].filter(o => o.stato !== 'consegnata' && o.chiusura);
  if (!list.length) return;
  try { const b = fs.writeBatch(db); for (const o of list) b.set(dref('pubbliche', o.id), pubDoc(o)); await b.commit(); }
  catch (e) { toast(errMsg(e), true); }
}
// Collega le prenotazioni arrivate dal link a un membro (per telefono o nome), creandolo se serve.
const linking = new Set();
function linkClienti(){
  const low = s => String(s||'').trim().toLowerCase(), dig = s => String(s||'').replace(/\D/g,'');
  for (const p of [...S.prenotazioni.values()]) {
    if (p.origine !== 'cliente' || p.membro_id || linking.has(p.id)) continue;
    linking.add(p.id);
    const d = dig(p.telefono);
    // Prima il nome esatto; il telefono vale solo se coincide anche il nome di battesimo
    // (familiari che prenotano dallo stesso telefono restano membri distinti).
    const primo = s => low(s).split(/\s+/)[0];
    let m = [...S.membri.values()].find(x => low(x.nome) === low(p.nome));
    if (!m && d.length >= 6) m = [...S.membri.values()].find(x => dig(x.telefono) === d && primo(x.nome) === primo(p.nome));
    if (!m) { m = {id:uid(), nome:String(p.nome).trim(), telefono:p.telefono||'', note:''}; put('membri', m.id, m); }
    else if (p.telefono && !m.telefono) put('membri', m.id, {telefono:p.telefono});
    put('prenotazioni', p.id, {membro_id:m.id});
  }
}
function subscribe(){
  unsubs.forEach(u => u()); unsubs = [];
  return Promise.all(COLS.map(c => new Promise((resolve, reject) => {
    let first = true;
    unsubs.push(fs.onSnapshot(fs.collection(db, c), {includeMetadataChanges:true}, snap => {
      if (!first && c === 'prenotazioni') for (const ch of snap.docChanges()) {
        const d = ch.doc.data();
        if (ch.type === 'added' && d.origine === 'cliente' && d.letta === false) { toast(`Nuova prenotazione da ${d.nome}`); try { navigator.vibrate?.(80); } catch {} }
      }
      S[c] = new Map(snap.docs.map(d => [d.id, fix(c, {...d.data(), id:d.id})]));
      const was = live; live = !snap.metadata.fromCache;
      if (first) { first = false; resolve(); return; }
      if (c === 'prenotazioni' || c === 'membri') linkClienti();
      if (phase === 'app') { if (dlg.open) { if (was !== live) renderNav(); } else render(); }
    }, err => {
      live = false;
      if (first) { first = false; reject(err); } else { toast(errMsg(err), true); renderNav(); }
    }));
  })));
}

async function boot(){
  if (!CFG.apiKey || /INCOLLA/.test(String(CFG.apiKey) + CFG.projectId)) { phase = 'config'; render(); return; }
  try {
    const [A, Au, F] = await Promise.all(['firebase-app.js','firebase-auth.js','firebase-firestore.js'].map(f => import(FB + f)));
    fs = F; fa = Au;
    const app = A.initializeApp(CFG);
    auth = Au.getAuth(app); db = F.getFirestore(app);
  } catch (e) { phase = 'error'; loginErr = 'Impossibile caricare Firebase: controlla la connessione.'; render(); return; }
  // Esito di un accesso con Apple/Google fatto per reindirizzamento (app installata).
  fa.getRedirectResult(auth).catch(err => { const m = erroreAccesso(err, 'Apple o Google'); if (m) { loginErr = m; if (phase === 'login') render(); } });
  fa.onAuthStateChanged(auth, u => {
    if (u) { if (!user || user.uid !== u.uid) { user = u; afterLogin(); } }
    else { user = null; unsubs.forEach(f => f()); unsubs = []; phase = 'login'; render(); }
  });
}
async function afterLogin(){
  phase = 'loading'; render();
  try {
    const s = await fs.getDoc(dref('impostazioni', 'generale'));
    Object.assign(SET, s.exists() ? s.data() : {});
    await subscribe();
  } catch (e) {
    if (/permission/i.test(String(e?.code || e?.message))) { phase = 'notadmin'; render(); return; }
    phase = 'error'; loginErr = errMsg(e); render(); return;
  }
  phase = 'app'; render(); linkClienti();
  if (SET.app_url !== appUrl()) await saveSetting('app_url', appUrl());
  if (!SET.notifiche && SET.ntfy_topic) await saveSetting('notifiche', [{tipo:'ntfy', attivo:true, topic:SET.ntfy_topic}]);
  syncPubbliche();
}

/* ---------- calcoli ---------- */
const ordini = () => [...S.ordinazioni.values()].sort((a,b) => String(b.chiusura||'').localeCompare(String(a.chiusura||'')));
function ordState(o){
  if (o.stato === 'consegnata') return 'consegnata';
  if (o.stato === 'chiusa') return 'chiusa';
  if (o.chiusura && new Date(o.chiusura) < new Date()) return 'chiusa';
  return 'aperta';
}
const prenOf = oid => [...S.prenotazioni.values()].filter(p => p.ord_id === oid).sort((a,b) => (a.letta === b.letta ? 0 : a.letta ? 1 : -1) || nomeDi(a).localeCompare(nomeDi(b),'it'));
const nomeDi = p => S.membri.get(p.membro_id)?.nome || p.nome || 'Senza nome';
const nonLette = oid => [...S.prenotazioni.values()].filter(p => p.letta === false && (!oid || p.ord_id === oid));
function prenTot(p, o){
  let r = 0, c = 0;
  for (const it of o.prodotti||[]) { const q = num(p.righe?.[it.pid]); r += q*it.pp; c += q*it.pf; }
  return {ricavo:r, costo:c, guadagno:r-c};
}
function ordStats(o){
  const prens = prenOf(o.id);
  const rows = (o.prodotti||[]).map(it => {
    const q = prens.reduce((s,p) => s + num(p.righe?.[it.pid]), 0);
    return {...it, q, ricavo:q*it.pp, costo:q*it.pf, guadagno:q*(it.pp-it.pf)};
  });
  const t = rows.reduce((a,r) => ({ricavo:a.ricavo+r.ricavo, costo:a.costo+r.costo, guadagno:a.guadagno+r.guadagno}), {ricavo:0,costo:0,guadagno:0});
  let incassato = 0, daIncassare = 0;
  for (const p of prens) { const v = prenTot(p,o).ricavo; if (p.pagato) incassato += v; else daIncassare += v; }
  return {...t, rows, prens, n:prens.length, incassato, daIncassare};
}
function prodStats(){
  const m = new Map();
  for (const o of ordini()) for (const r of ordStats(o).rows) {
    const cur = m.get(r.pid) || {pid:r.pid, nome:r.nome, unita:r.unita, categoria:r.categoria, q:0, ricavo:0, costo:0, guadagno:0, ordini:0};
    cur.q += r.q; cur.ricavo += r.ricavo; cur.costo += r.costo; cur.guadagno += r.guadagno; if (r.q > 0) cur.ordini++;
    m.set(r.pid, cur);
  }
  return m;
}
const pct = (g, r) => r > 0 ? Math.round(g/r*100) + '%' : '—';
const signCls = n => n < 0 ? 'neg' : 'pos';

/* ---------- messaggi ---------- */
function msgAnnuncio(o){
  const L = [`*${o.titolo}*`, '', `Prenotazioni aperte fino a *${fmtDTlong(o.chiusura)}*`];
  if (o.consegna) L.push(`Consegna prevista: ${fmtDlong(o.consegna)}`);
  for (const cat of ['agrumi','fda']) {
    const items = (o.prodotti||[]).filter(p => p.categoria === cat);
    if (!items.length) continue;
    L.push('', `*${CAT_MSG[cat]}*`);
    for (const it of items) L.push(`• ${it.nome} — ${fmtE(it.pp)}/${it.unita}`);
  }
  if (o.note) L.push('', o.note);
  L.push('', '👉 *Prenota da qui:*', linkOrdina(o.id));
  return L.join('\n');
}
function msgFornitore(o){
  const st = ordStats(o);
  const L = [`Ordine per Forme dell'Anima — ${o.titolo}`];
  if (o.consegna) L.push(`Consegna: ${fmtDlong(o.consegna)}`);
  L.push('');
  for (const cat of ['agrumi','fda']) {
    const rows = st.rows.filter(r => r.categoria === cat && r.q > 0);
    if (!rows.length) continue;
    L.push(`*${CAT[cat]}*`);
    for (const r of rows) L.push(`• ${r.nome}: ${fmtQ(r.q)} ${r.unita}  (${fmtE(r.costo)})`);
    L.push('');
  }
  L.push(`Totale: ${fmtE(st.costo)}`);
  return L.join('\n');
}
function msgMembro(p, o){
  const t = prenTot(p,o);
  const L = [`Ciao ${nomeDi(p).split(' ')[0]}! Ecco la tua prenotazione per "${o.titolo}":`, ''];
  for (const it of o.prodotti||[]) { const q = num(p.righe?.[it.pid]); if (q>0) L.push(`• ${fmtQ(q)} ${it.unita} ${it.nome} — ${fmtE(q*it.pp)}`); }
  L.push('', `Totale: *${fmtE(t.ricavo)}*`);
  if (o.consegna) L.push(`Consegna: ${fmtDlong(o.consegna)}`);
  if (p.pagato) L.push('Pagamento ricevuto, grazie!');
  L.push('', `Stato della prenotazione: ${linkStato(p.id)}`);
  return L.join('\n');
}
function msgConsegne(o){
  const L = [`Lista consegne — ${o.titolo}`, ''];
  for (const p of prenOf(o.id).sort((a,b) => nomeDi(a).localeCompare(nomeDi(b),'it'))) {
    const items = (o.prodotti||[]).filter(it => num(p.righe?.[it.pid])>0).map(it => `${fmtQ(num(p.righe[it.pid]))} ${it.unita} ${it.nome}`);
    if (!items.length) continue;
    L.push(`${p.pagato?'✅':'⬜'} *${nomeDi(p)}* — ${fmtE(prenTot(p,o).ricavo)}${p.pagato?'':' (da pagare)'}`);
    L.push('   ' + items.join(', '));
  }
  return L.join('\n');
}
const waLink = (text, phone) => {
  let ph = String(phone||'').replace(/\D/g,'');
  if (ph.length === 10 && ph.startsWith('3')) ph = '39' + ph;
  return `https://wa.me/${ph}?text=${encodeURIComponent(text)}`;
};

/* ---------- lettura risposta WhatsApp (per chi risponde ancora in chat) ---------- */
const NUMW = {un:1,uno:1,una:1,mezzo:.5,mezza:.5,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9,dieci:10};
const STOP = new Set('per di da del della dello dei delle degli con ciao vorrei prendo prenoto grazie anche poi the kg chili chilo kili kilo gr grammi pz pezzi pezzo ok buongiorno buonasera salve io mi ne al alla allo ai'.split(' '));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const stem = w => w.slice(0, Math.min(w.length, 5));
function parseReply(text, prods){
  const out = {}, nope = [];
  const words = p => norm(p).split(/[^a-z]+/).filter(w => w.length >= 3 && !STOP.has(w) && !(w in NUMW));
  const pw = prods.map(p => ({p, w:new Set([...words(p.nome), ...words(p.unita)].map(stem))}));
  let segs = norm(text).split(/[\n,;+]|\s+e\s+|\s+-\s+/);
  segs = segs.flatMap(s => (s.match(/\d+(?:[.,]\d+)?/g)||[]).length > 1 ? s.split(/\s+(?=\d)/) : [s]);
  for (const raw of segs) {
    const s = raw.trim(); if (!s) continue;
    const m = s.match(/(\d+(?:[.,]\d+)?)/);
    let q = m ? num(m[1]) : null;
    if (q === null) { const nw = s.split(/[^a-z]+/).find(w => w in NUMW); if (nw) q = NUMW[nw]; }
    const ws = words(s).map(stem);
    let best = null, score = 0;
    for (const x of pw) { const sc = ws.filter(w => x.w.has(w)).length; if (sc > score) { score = sc; best = x.p; } }
    if (best && q) out[best.pid] = (out[best.pid]||0) + q;
    else if (ws.length) nope.push(raw.trim());
  }
  return {out, nope};
}

function erroreAccesso(err, nome){
  const c = String(err?.code || '');
  if (/popup-closed-by-user|cancelled-popup-request|user-cancelled|redirect-cancelled/.test(c)) return '';
  if (/operation-not-allowed|configuration-not-found|invalid-oauth/.test(c)) return `L'accesso con ${nome} non è ancora attivo in Firebase (Authentication → Metodi di accesso).`;
  if (/unauthorized-domain/.test(c)) return 'Questo indirizzo non è tra i domini autorizzati di Firebase (Authentication → Impostazioni).';
  if (/account-exists-with-different-credential/.test(c)) return 'Esiste già un account con la stessa email: accedi con email e password.';
  if (/web-storage-unsupported|missing-initial-state/.test(c)) return `Da qui l'accesso con ${nome} non riesce: apri l'app nel browser (Safari o Chrome) oppure usa email e password.`;

function niceMax(v){ if (v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1,2,2.5,5,10]) if (m*p >= v) return m*p; return 10*p; }
function barChart(os, stats){
  if (!os.length) return '';
  const W = 560, H = 230, L = 46, B = 34, T = 18, Rr = 8;
  const max = niceMax(Math.max(...os.map(o => stats.get(o.id).ricavo), 1));
  const iw = W - L - Rr, ih = H - B - T, bw = Math.min(46, iw / os.length * .6);
  const y = v => T + ih - v/max*ih;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max*i/4; g += `<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1000?(v/1000).toLocaleString('it-IT')+'k':Math.round(v)}€</text>`; }
  os.forEach((o, i) => {
    const s = stats.get(o.id); const cx = L + iw*(i+.5)/os.length; const x = cx - bw/2;
    const costo = Math.max(0, Math.min(s.costo, s.ricavo)); const gu = Math.max(0, s.ricavo - costo);
    g += `<rect x="${x}" y="${y(costo)}" width="${bw}" height="${y(0)-y(costo)}" fill="var(--cost)" rx="2"/>`;
    g += `<rect x="${x}" y="${y(costo+gu)}" width="${bw}" height="${y(costo)-y(costo+gu)}" fill="var(--leaf)" rx="2"/>`;
    if (s.ricavo > 0) g += `<text x="${cx}" y="${y(s.ricavo)-5}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${Math.round(s.guadagno)}€</text>`;
    const lab = (o.titolo||'').length > 11 ? o.titolo.slice(0,10)+'…' : o.titolo;
    g += `<text x="${cx}" y="${H-B+16}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(lab)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ricavi e guadagno per ordinazione">${g}</svg>`;
}

}
function tabPrenotazioni(o, st){

  <div class="list">${st.prens.map(p => {
    const t = prenTot(p, o);
    const items = (o.prodotti||[]).filter(it => num(p.righe?.[it.pid])>0).map(it => `${fmtQ(num(p.righe[it.pid]))} ${esc(it.unita)} ${esc(it.nome)}`).join(' · ');

          <button class="tog ${p.consegnato?'on':''}" data-act="togDel" data-id="${p.id}">${p.consegnato?'Consegnato':'Non consegnato'}</button>

function tabRiepilogo(o, st){

  return `<div class="panel"><div class="row between" style="margin-bottom:8px"><h2>Prodotti, quantità e conti</h2><button class="btn sm" data-act="editOrd" data-id="${o.id}">Modifica prezzi</button></div>
  <div class="tscroll"><table>
    <thead><tr><th>Prodotto</th><th class="n">Pubblico</th><th class="n">FdA</th><th class="n">Margine</th><th class="n">Q.tà</th><th class="n">Ricavo</th><th class="n">Costo</th><th class="n">Guadagno</th></tr></thead>
    <tbody>${st.rows.map(r => `<tr><td><b>${esc(r.nome)}</b><br><span class="cat ${r.categoria}">${CAT[r.categoria]||''}</span> <span class="small muted">/${esc(r.unita)}</span></td>
      <td class="n">${fmtE(r.pp)}</td><td class="n">${fmtE(r.pf)}</td><td class="n ${signCls(r.pp-r.pf)}">${fmtE(r.pp-r.pf)}<br><span class="small muted">${pct(r.pp-r.pf, r.pp)}</span></td>
      <td class="n"><b>${fmtQ(r.q)}</b></td><td class="n">${fmtE(r.ricavo)}</td><td class="n">${fmtE(r.costo)}</td><td class="n ${signCls(r.guadagno)}">${fmtE(r.guadagno)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="5">Totale</td><td class="n">${fmtE(st.ricavo)}</td><td class="n">${fmtE(st.costo)}</td><td class="n ${signCls(st.guadagno)}">${fmtE(st.guadagno)}</td></tr></tfoot>
  </table></div></div>`;
}
let MSGS = {};

    <div class="msg">${esc(text)}</div>

function tabMessaggi(o, st){

function viewProdotti(){
  const ps = [...S.prodotti.values()].sort((a,b) => (a.categoria||'').localeCompare(b.categoria||'') || a.nome.localeCompare(b.nome,'it'));
  const stats = prodStats();
  const group = cat => { const items = ps.filter(p => p.categoria === cat); return `<section class="panel"><div class="row between" style="margin-bottom:4px"><h2>${CAT[cat]}</h2><span class="small muted">${items.length} prodott${items.length===1?'o':'i'}</span></div>
    ${items.length ? `<div class="list">${items.map(p => { const s = stats.get(p.id); const m = p.pp - p.pf; return `<div class="li">
      <div class="main"><div class="t">${esc(p.nome)}</div><div class="d">Pubblico <b style="color:var(--ink)">${fmtE(p.pp)}</b> · FdA ${fmtE(p.pf)} · per ${esc(p.unita)}</div>
      ${s && s.q ? `<div class="d">Venduti ${fmtQ(s.q)} ${esc(p.unita)} in ${s.ordini} ordinazion${s.ordini===1?'e':'i'} · guadagno <span class="${signCls(s.guadagno)}">${fmtE(s.guadagno)}</span></div>` : ''}</div>
      <div class="side"><span class="${signCls(m)}">+${fmtE(m)}</span><span class="small muted">${pct(m, p.pp)}</span><button class="btn sm" data-act="editProd" data-id="${p.id}">Modifica</button></div>
    </div>`; }).join('')}</div>` : `<p class="muted small" style="margin:6px 0 0">Nessun prodotto in questa categoria.</p>`}</section>`; };
  return `<div class="stack">
    <div class="row between"><div><h1>Prodotti</h1><div class="small muted">Prezzi di partenza: ogni ordinazione può cambiarli.</div></div><button class="btn primary" data-act="newProd">${ICON.plus}Nuovo prodotto</button></div>
    ${group('agrumi')}${group('fda')}
  </div>`;
}
function viewMembri(){
  const ms = [...S.membri.values()].sort((a,b) => a.nome.localeCompare(b.nome,'it'));
  const agg = new Map();
  for (const p of S.prenotazioni.values()) {
    const o = S.ordinazioni.get(p.ord_id); if (!o) continue;
    const a = agg.get(p.membro_id) || {n:0, speso:0, debito:0};
    const t = prenTot(p,o).ricavo; a.n++; a.speso += t; if (!p.pagato) a.debito += t; agg.set(p.membro_id, a);
  }
  return `<div class="stack">
    <div class="row between"><div><h1>Membri</h1><div class="small muted">Si aggiungono da soli quando qualcuno prenota dal link.</div></div><button class="btn primary" data-act="newMem">${ICON.plus}Nuovo membro</button></div>
    <div class="panel">${ms.length ? `<div class="list">${ms.map(m => { const a = agg.get(m.id) || {n:0,speso:0,debito:0}; return `<div class="li">
      <div class="main"><div class="t">${esc(m.nome)}</div><div class="d">${m.telefono?esc(m.telefono)+' · ':''}${a.n} prenotazion${a.n===1?'e':'i'} · speso ${fmtE(a.speso)}</div>${m.note?`<div class="d">${esc(m.note)}</div>`:''}</div>
      <div class="side">${a.debito>0?`<span class="chip bad">deve ${fmtE(a.debito)}</span>`:`<span class="chip ok">in regola</span>`}<button class="btn sm" data-act="editMem" data-id="${m.id}">Modifica</button></div>
    </div>`; }).join('')}</div>` : `<p class="muted" style="margin:0">Nessun membro ancora.</p>`}</div>
  </div>`;
}

/* ---------- form ---------- */
function formOrdine(o, dup){
  const editing = o && !dup;
  const def = new Date(Date.now() + 4*864e5); def.setHours(20,0,0,0);
  const cons = new Date(def.getTime() + 2*864e5);
  const defTitle = `Ordinazione del ${def.toLocaleDateString('it-IT',{day:'numeric',month:'long'})}`;
  const v = {
    titolo: editing ? o.titolo : defTitle,
    chiusura: editing && o.chiusura ? toLocalDT(new Date(o.chiusura)) : toLocalDT(def),
    consegna: editing ? (o.consegna||'') : toLocalDT(cons).slice(0,10),
    note: o?.note || '',
  };
  const inOrd = new Map((o?.prodotti||[]).map(p => [p.pid, p]));
  const cat = [...S.prodotti.values()];
  const all = [...cat.map(p => ({pid:p.id, nome:p.nome, categoria:p.categoria, unita:p.unita, pp:inOrd.get(p.id)?.pp ?? p.pp, pf:inOrd.get(p.id)?.pf ?? p.pf, on: o ? inOrd.has(p.id) : true})),
    ...[...inOrd.values()].filter(p => !S.prodotti.has(p.pid)).map(p => ({...p, on:true}))]
    .sort((a,b) => (a.categoria||'').localeCompare(b.categoria||'') || a.nome.localeCompare(b.nome,'it'));
  const prow = p => `<div class="prow ${p.on?'':'off'}" data-pid="${esc(p.pid)}" data-nome="${esc(p.nome)}" data-cat="${esc(p.categoria)}" data-unita="${esc(p.unita)}">
      <input type="checkbox" class="pon" ${p.on?'checked':''} aria-label="Includi ${esc(p.nome)}">
      <div><b>${esc(p.nome)}</b> <span class="cat ${p.categoria}">${CAT[p.categoria]||''}</span> <span class="small muted">/${esc(p.unita)}</span></div>
      <div class="pf"><label>Prezzo pubblico €<input class="ppp" inputmode="decimal" value="${fmtIn(p.pp)}"></label><label>Prezzo FdA €<input class="ppf" inputmode="decimal" value="${fmtIn(p.pf)}"></label></div>
      <div class="pf"><span class="marg"></span></div>
    </div>`;
  openDialog(editing ? 'Modifica ordinazione' : 'Nuova ordinazione', `
    <label class="f">Nome<input id="o-titolo" required value="${esc(v.titolo)}"></label>
    <div class="fgrid st">
      <label class="f">Prenotazioni entro<input type="datetime-local" id="o-chiusura" required value="${esc(v.chiusura)}"></label>
      <label class="f">Consegna prevista<input type="date" id="o-consegna" value="${esc(v.consegna)}"></label>
    </div>
    <label class="f">Nota per i clienti (facoltativa)<textarea id="o-note" placeholder="Es. ritiro in piazza dalle 18 alle 19, pagamento alla consegna">${esc(v.note)}</textarea></label>
    <div><div class="row between"><h3>Prodotti disponibili</h3><button type="button" class="btn sm" id="addNewProd">${ICON.plus}Nuovo prodotto</button></div>
      <div class="small muted">Spunta i prodotti di questa settimana e controlla i prezzi. I clienti vedono solo il prezzo al pubblico.</div>
      <div id="prows">${all.map(prow).join('') || '<p class="small muted" id="noProd">Nessun prodotto in catalogo: aggiungine uno con il pulsante qui sopra.</p>'}</div>
      ${cat.length ? `<label class="check small"><input type="checkbox" id="o-sync" checked>Aggiorna anche i prezzi nel catalogo prodotti</label>` : ''}
    </div>`, {
    ok: editing ? 'Salva' : 'Crea ordinazione',
    onOpen: f => {
      const upd = row => { const pp = num(row.querySelector('.ppp').value), pf = num(row.querySelector('.ppf').value); const m = row.querySelector('.marg'); if (m) m.textContent = `Margine ${fmtE(pp-pf)} (${pct(pp-pf,pp)})`; };
      f.querySelectorAll('.prow').forEach(upd);
      f.querySelector('#prows').addEventListener('input', e => { const row = e.target.closest('.prow'); if (!row) return; if (e.target.classList.contains('pon')) row.classList.toggle('off', !e.target.checked); upd(row); });
      f.querySelector('#addNewProd').onclick = () => {
        f.querySelector('#noProd')?.remove();
        const d = document.createElement('div'); d.className = 'prow'; d.dataset.new = '1'; d.dataset.pid = uid();
        d.innerHTML = `<input type="checkbox" class="pon" checked aria-label="Includi"><div><b>Nuovo prodotto</b></div>
          <div class="pnew"><input class="full nnome" placeholder="Nome, es. Arance Tarocco" aria-label="Nome prodotto"><select class="ncat" aria-label="Categoria"><option value="agrumi">Agrumi bio</option><option value="fda">Forme dell'Anima</option></select><input class="nunita" placeholder="Unità, es. kg" value="kg" aria-label="Unità"></div>
          <div class="pf"><label>Prezzo pubblico €<input class="ppp" inputmode="decimal"></label><label>Prezzo FdA €<input class="ppf" inputmode="decimal"></label></div><div class="pf"><span class="marg"></span></div>`;
        f.querySelector('#prows').appendChild(d); d.querySelector('.nnome').focus();
      };
    },
    onSubmit: f => {
      const titolo = f.querySelector('#o-titolo').value.trim(), chiusuraIn = f.querySelector('#o-chiusura').value;
      if (!titolo || !chiusuraIn) { toast('Inserisci nome e data di chiusura', true); return false; }
      const chiusura = new Date(chiusuraIn).toISOString();
      const sync = f.querySelector('#o-sync')?.checked;
      const prodotti = [];
      for (const row of f.querySelectorAll('.prow')) {
        if (!row.querySelector('.pon').checked) continue;
        const pp = num(row.querySelector('.ppp').value), pf = num(row.querySelector('.ppf').value);
        if (row.dataset.new) {
          const nome = row.querySelector('.nnome').value.trim(); if (!nome) continue;
          const p = {nome, categoria:row.querySelector('.ncat').value, unita:row.querySelector('.nunita').value.trim()||'pz', pp, pf};
          put('prodotti', row.dataset.pid, p); prodotti.push({pid:row.dataset.pid, ...p});
        } else {
          const p = {pid:row.dataset.pid, nome:row.dataset.nome, categoria:row.dataset.cat, unita:row.dataset.unita, pp, pf};
          prodotti.push(p);
          const c = S.prodotti.get(p.pid);
          if (sync && c && (c.pp !== pp || c.pf !== pf)) put('prodotti', c.id, {pp, pf});
        }
      }
      if (!prodotti.length) { toast('Scegli almeno un prodotto', true); return false; }
      const id = editing ? o.id : uid();
      let stato = editing ? o.stato : 'aperta';
      if (editing && stato === 'chiusa' && new Date(chiusura) > new Date() && o.riapri) stato = 'aperta';
      put('ordinazioni', id, {titolo, chiusura, consegna:f.querySelector('#o-consegna').value, note:f.querySelector('#o-note').value.trim(), prodotti, stato});
      if (!editing) { ordTab = 'messaggi'; location.hash = 'ord-' + id; toast('Ordinazione creata: copia il messaggio per il gruppo'); }
      else toast('Ordinazione salvata');
    }
  });
}

    <div class="fgrid st">
      <label class="f">Nome<input id="p-nome" list="membriList" autocomplete="off" required value="${esc(p ? nomeDi(p) : '')}" placeholder="Chi ha prenotato"></label>
      <label class="f">Telefono (facoltativo)<input id="p-tel" type="tel" inputmode="tel" value="${esc(p ? (p.telefono || S.membri.get(p.membro_id)?.telefono || '') : '')}"></label>
    </div>
    <datalist id="membriList">${membri.map(m => `<option value="${esc(m.nome)}">`).join('')}</datalist>
    ${editing ? '' : `<details><summary class="small" style="font-weight:600;cursor:pointer;min-height:32px">Ha risposto in chat? Incolla il messaggio</summary>
      <label class="f" style="margin-top:8px">Testo del messaggio<textarea id="p-paste" placeholder="Es. Ciao! 3 kg arance, 2 kg limoni e una marmellata"></textarea></label>
      <div class="row" style="margin-top:8px"><button type="button" class="btn sm peel" id="parseBtn">Riconosci quantità</button><span class="small muted" id="parseOut"></span></div>
    </details>`}
    <div class="qty">${(o.prodotti||[]).map(it => `<div class="qrow" data-pid="${esc(it.pid)}"><div><div class="t">${esc(it.nome)}</div><div class="d">${fmtE(it.pp)} / ${esc(it.unita)}<span class="lt"></span></div></div><input class="q" inputmode="decimal" placeholder="0" aria-label="Quantità ${esc(it.nome)} in ${esc(it.unita)}" value="${righe[it.pid] ? fmtIn(righe[it.pid]) : ''}"></div>`).join('')}
      <div class="qtot"><span>Totale</span><span id="p-tot">${fmtE(0)}</span></div></div>
    <label class="f">Nota<input id="p-nota" value="${esc(p?.nota||'')}" placeholder="Es. ritira la sorella"></label>
    <div class="row" style="gap:18px"><label class="check"><input type="checkbox" id="p-pag" ${p?.pagato?'checked':''}>Pagato</label><label class="check"><input type="checkbox" id="p-con" ${p?.consegnato?'checked':''}>Consegnato</label></div>`, {
    ok: editing ? 'Salva' : 'Aggiungi',
    onOpen: f => {
      const tot = () => { let t = 0; f.querySelectorAll('.qrow').forEach(r => { const it = o.prodotti.find(x => x.pid === r.dataset.pid); const q = num(r.querySelector('.q').value); t += q*it.pp; r.querySelector('.lt').textContent = q ? ` · ${fmtE(q*it.pp)}` : ''; }); f.querySelector('#p-tot').textContent = fmtE(t); };
      f.querySelector('.qty').addEventListener('input', tot); tot();
      f.querySelector('#p-nome').addEventListener('change', e => { const m = membri.find(m => m.nome.toLowerCase() === e.target.value.trim().toLowerCase()); if (m && !f.querySelector('#p-tel').value) f.querySelector('#p-tel').value = m.telefono||''; });
      const pb = f.querySelector('#parseBtn');
      if (pb) pb.onclick = () => {
        const {out, nope} = parseReply(f.querySelector('#p-paste').value, o.prodotti||[]);
        let n = 0;
        f.querySelectorAll('.qrow').forEach(r => { r.classList.remove('hit'); if (out[r.dataset.pid] != null) { r.querySelector('.q').value = fmtIn(out[r.dataset.pid]); r.classList.add('hit'); n++; } });
        f.querySelector('#parseOut').textContent = (n ? `${n} prodott${n===1?'o':'i'} riconosciut${n===1?'o':'i'}, controlla le quantità.` : 'Nessun prodotto riconosciuto, inserisci a mano.') + (nope.length ? ` Non capito: "${nope.join('", "')}"` : '');
        tot();
      };
    },
    onSubmit: f => {
      const nome = f.querySelector('#p-nome').value.trim();
      if (!nome) { toast('Inserisci il nome', true); return false; }
      const tel = f.querySelector('#p-tel').value.trim();
      const nr = {};
      f.querySelectorAll('.qrow').forEach(r => { const q = num(r.querySelector('.q').value); if (q > 0) nr[r.dataset.pid] = q; });
      if (!Object.keys(nr).length) { toast('Inserisci almeno una quantità', true); return false; }
      let m = [...S.membri.values()].find(m => m.nome.toLowerCase() === nome.toLowerCase());
      if (!m) { m = {id:uid(), nome, telefono:tel, note:''}; put('membri', m.id, m); }
      else if (tel && tel !== m.telefono) put('membri', m.id, {telefono:tel});
      const data = {ord_id:o.id, membro_id:m.id, nome:m.nome, telefono:tel, righe:nr, nota:f.querySelector('#p-nota').value.trim(), pagato:f.querySelector('#p-pag').checked, consegnato:f.querySelector('#p-con').checked, letta:true};
      if (editing) { put('prenotazioni', p.id, data); toast('Prenotazione salvata'); return; }
      const ex = prenOf(o.id).find(x => x.membro_id === m.id);
      if (ex) {
        const merged = {...(ex.righe||{})}; for (const [k,q] of Object.entries(nr)) merged[k] = num(merged[k]) + q;
        put('prenotazioni', ex.id, {righe:merged, nota:[ex.nota, data.nota].filter(Boolean).join(' · '), pagato: ex.pagato && data.pagato, letta:true});
        toast(`Aggiunto alla prenotazione già presente di ${m.nome}`);
      } else { put('prenotazioni', uid(), {...data, origine:'gestore', created_at:new Date().toISOString()}); toast('Prenotazione aggiunta'); }
    }
  });
}
function formProd(p){
  openDialog(p ? 'Modifica prodotto' : 'Nuovo prodotto', `
    <label class="f">Nome<input id="pr-nome" required value="${esc(p?.nome||'')}" placeholder="Es. Arance Tarocco"></label>
    <div class="fgrid">
      <label class="f">Categoria<select id="pr-cat"><option value="agrumi" ${p?.categoria==='fda'?'':'selected'}>Agrumi bio</option><option value="fda" ${p?.categoria==='fda'?'selected':''}>Forme dell'Anima</option></select></label>
      <label class="f">Unità di vendita<input id="pr-unita" list="unitList" value="${esc(p?.unita||'kg')}"></label>
    </div>
    <datalist id="unitList"><option value="kg"><option value="cassetta"><option value="pz"><option value="vasetto"><option value="bottiglia"><option value="confezione"></datalist>
    <div class="fgrid">
      <label class="f">Prezzo al pubblico €<input id="pr-pp" inputmode="decimal" value="${fmtIn(p?.pp)}"></label>
      <label class="f">Prezzo Forme dell'Anima €<input id="pr-pf" inputmode="decimal" value="${fmtIn(p?.pf)}"></label>
    </div>
    <div class="small muted" id="pr-m"></div>`, {
    extra: p ? `<button type="button" class="btn danger" data-act="delProd" data-id="${p.id}" style="margin-right:auto">Elimina</button>` : '',
    onOpen: f => { const u = () => { const pp = num(f.querySelector('#pr-pp').value), pf = num(f.querySelector('#pr-pf').value); f.querySelector('#pr-m').textContent = `Guadagno per unità: ${fmtE(pp-pf)} (${pct(pp-pf,pp)} del prezzo al pubblico)`; }; f.addEventListener('input', u); u(); },
    onSubmit: f => {
      const nome = f.querySelector('#pr-nome').value.trim(); if (!nome) { toast('Inserisci il nome', true); return false; }
      put('prodotti', p?.id || uid(), {nome, categoria:f.querySelector('#pr-cat').value, unita:f.querySelector('#pr-unita').value.trim()||'pz', pp:num(f.querySelector('#pr-pp').value), pf:num(f.querySelector('#pr-pf').value)});
      toast('Prodotto salvato');
    }
  });
}
function formMem(m){
  openDialog(m ? 'Modifica membro' : 'Nuovo membro', `
    <label class="f">Nome<input id="m-nome" required value="${esc(m?.nome||'')}"></label>
    <label class="f">Telefono<input id="m-tel" type="tel" inputmode="tel" value="${esc(m?.telefono||'')}" placeholder="Es. 333 123 4567"></label>
    <label class="f">Note<input id="m-note" value="${esc(m?.note||'')}" placeholder="Es. ritira sempre il sabato"></label>`, {
    extra: m ? `<button type="button" class="btn danger" data-act="delMem" data-id="${m.id}" style="margin-right:auto">Elimina</button>` : '',
    onSubmit: f => {
      const nome = f.querySelector('#m-nome').value.trim(); if (!nome) { toast('Inserisci il nome', true); return false; }
      put('membri', m?.id || uid(), {nome, telefono:f.querySelector('#m-tel').value.trim(), note:f.querySelector('#m-note').value.trim()});
      toast('Membro salvato');
    }
  });
}
function formSettings(){
  const fixed = linkOrdina();
  const N = window.Notifiche;
  const canale = t => (SET.notifiche || []).find(c => c.tipo === t) || {tipo:t, attivo:false};
  const sezioneCanale = fo => { const c = canale(fo.tipo); return `
    <div class="panel stack" style="gap:8px;padding:12px" data-canale="${esc(fo.tipo)}">
      <label class="check"><input type="checkbox" class="c-on" ${c.attivo !== false && fo.campi.some(x => c[x.k]) ? 'checked' : ''}><b>${esc(fo.nome)}</b></label>
      <div class="small muted">${fo.istruzioni || ''}</div>
      ${fo.campi.map(x => `<label class="f">${esc(x.label)}<input class="c-campo" data-k="${esc(x.k)}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(c[x.k] || '')}" placeholder="${esc(x.placeholder || '')}"></label>
        <div class="row">${x.genera ? `<button type="button" class="btn sm" data-gen="${esc(x.k)}">Genera</button>` : ''}<button type="button" class="btn sm" data-copy="${esc(x.k)}">${ICON.copy}Copia</button></div>`).join('')}
      ${fo.lato === 'cliente' ? `<div><button type="button" class="btn sm peel c-test">Invia prova</button></div>` : `<div class="small muted">Questo canale viene inviato da un server, non da questa pagina.</div>`}
    </div>`; };
  const leggi = (f) => [...f.querySelectorAll('[data-canale]')].map(box => {
    const c = {tipo:box.dataset.canale, attivo:box.querySelector('.c-on').checked};
    box.querySelectorAll('.c-campo').forEach(i => c[i.dataset.k] = i.value.trim());
    return c;
  });
  openDialog('Impostazioni', `
    <section class="stack" style="gap:8px"><h3>Link fisso per i clienti</h3>
      <div class="small muted">Apre sempre l'ordinazione aperta del momento. Puoi metterlo nella descrizione del gruppo WhatsApp.</div>
      <div class="code">${esc(fixed)}</div>
      <div><button type="button" class="btn sm" id="copyFixed">${ICON.copy}Copia link</button></div>
    </section>
    <section class="stack" style="gap:8px"><h3>Notifiche delle nuove prenotazioni</h3>
      ${N ? N.fornitori().map(sezioneCanale).join('') : '<div class="small muted">Modulo notifiche non caricato.</div>'}
    </section>
    <section class="stack" style="gap:8px"><h3>Installa l'app</h3>
      ${installaHtml()}
    </section>
    <section class="stack" style="gap:8px"><h3>Account</h3>
      <div class="small muted">Accesso come <b>${esc(user?.email)}</b></div>
      <div><button type="button" class="btn sm danger" data-act="logout">Esci</button></div>
    </section>`, {
    ok: 'Salva',
    onOpen: f => {
      f.querySelector('#copyFixed').onclick = () => copyText(fixed);
      f.querySelectorAll('[data-canale]').forEach(box => {
        const fo = N.fornitori().find(x => x.tipo === box.dataset.canale);
        const inp = k => box.querySelector(`.c-campo[data-k="${k}"]`);
        box.querySelectorAll('[data-gen]').forEach(b => b.onclick = () => { inp(b.dataset.gen).value = fo.campi.find(x => x.k === b.dataset.gen).genera(); box.querySelector('.c-on').checked = true; });
        box.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyText(inp(b.dataset.copy).value.trim()));
        const t = box.querySelector('.c-test');
        if (t) t.onclick = async () => {
          const c = leggi(f).find(x => x.tipo === fo.tipo); c.attivo = true;
          const err = fo.valida(c); if (err) { toast(err, true); return; }
          const [r] = await N.invia([c], {tipo:'prova', titolo:'Ordini Agrumi: prova', messaggio:'Le notifiche delle nuove prenotazioni funzionano.', link:appUrl()});
          toast(r?.ok ? 'Notifica di prova inviata' : 'Invio non riuscito: ' + (r?.motivo || 'controlla la connessione'), !r?.ok);
        };
      });
    },
    onSubmit: async f => {
      if (!N) return;
      const canali = leggi(f).filter(c => c.attivo || Object.keys(c).some(k => k !== 'tipo' && k !== 'attivo' && c[k]));
      for (const c of canali) {
        const fo = N.fornitori().find(x => x.tipo === c.tipo); const err = c.attivo ? fo.valida(c) : '';
        if (err) { toast(err, true); return false; }
      }
      if (JSON.stringify(canali) !== JSON.stringify(SET.notifiche || [])) { await saveSetting('notifiche', canali); syncPubbliche(); }
      toast('Impostazioni salvate');
    }
  });
}

/* ---------- azioni ---------- */
function markRead(list){ for (const p of list) if (p.letta === false) put('prenotazioni', p.id, {letta:true}); }
const ACT = {
  settings: () => formSettings(),
  logout: async () => { unsubs.forEach(f => f()); unsubs = []; await fa.signOut(auth); },
  newOrd: () => formOrdine(null),
  editOrd: id => formOrdine(S.ordinazioni.get(id)),
  dupOrd: id => formOrdine(S.ordinazioni.get(id), true),
  copyLink: id => copyText(linkOrdina(id)),
  closeOrd: id => { put('ordinazioni', id, {stato:'chiusa'}); toast('Prenotazioni chiuse: il link non accetta più ordini'); },
  deliverOrd: id => { put('ordinazioni', id, {stato:'consegnata'}); toast('Ordinazione segnata come consegnata'); },
  reopenOrd: id => { const o = S.ordinazioni.get(id);
    if (new Date(o.chiusura) < new Date()) { toast('Scegli una nuova data di chiusura'); put('ordinazioni', id, {stato:'aperta'}); formOrdine(S.ordinazioni.get(id)); return; }
    put('ordinazioni', id, {stato:'aperta'}); toast('Ordinazione riaperta'); },
  delOrd: id => { const o = S.ordinazioni.get(id); const n = prenOf(id).length;
    confirmDo('Eliminare l\'ordinazione?', `"${esc(o.titolo)}" e le sue ${n} prenotazioni verranno eliminate definitivamente.`, 'Elimina', () => { const ids = prenOf(id).map(p => p.id); for (const k of ids) S.prenotazioni.delete(k); del('ordinazioni', id, ids); location.hash = 'ordinazioni'; toast('Ordinazione eliminata'); }); },
  newPren: id => formPren(S.ordinazioni.get(id)),
  editPren: id => { const p = S.prenotazioni.get(id); if (p.letta === false) put('prenotazioni', id, {letta:true}); formPren(S.ordinazioni.get(p.ord_id), p); },
  delPren: id => { const p = S.prenotazioni.get(id); confirmDo('Eliminare la prenotazione?', `La prenotazione di ${esc(nomeDi(p))} verrà eliminata.`, 'Elimina', () => { del('prenotazioni', id); toast('Prenotazione eliminata'); }); },
  togPaid: id => { const p = S.prenotazioni.get(id); put('prenotazioni', id, {pagato:!p.pagato, letta:true}); },
  togDel: id => { const p = S.prenotazioni.get(id); put('prenotazioni', id, {consegnato:!p.consegnato, letta:true}); },
  copyPren: id => { const p = S.prenotazioni.get(id); copyText(msgMembro(p, S.ordinazioni.get(p.ord_id))); },
  copyMsg: k => copyText(MSGS[k] || ''),
  readAll: () => markRead(nonLette()),
  readOrd: id => markRead(nonLette(id)),
  openPrenOrd: id => { const p = S.prenotazioni.get(id); ordTab = 'prenotazioni'; location.hash = 'ord-' + p.ord_id; },
  tab: k => { ordTab = k; render(); },
  filter: k => { ordFilter = k; render(); },
  newProd: () => formProd(null),
  editProd: id => formProd(S.prodotti.get(id)),
  delProd: id => { const p = S.prodotti.get(id); confirmDo('Eliminare il prodotto?', `"${esc(p.nome)}" verrà tolto dal catalogo. Le ordinazioni passate mantengono i loro dati.`, 'Elimina', () => { del('prodotti', id); toast('Prodotto eliminato'); }); },
  newMem: () => formMem(null),
  editMem: id => formMem(S.membri.get(id)),
  delMem: id => { const m = S.membri.get(id); confirmDo('Eliminare il membro?', `${esc(m.nome)} verrà tolto dall'elenco. Le sue prenotazioni restano con il suo nome.`, 'Elimina', () => { del('membri', id); toast('Membro eliminato'); }); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  e.preventDefault();
  if (dlg.contains(b) && dlg.open) { dlg.close(); setTimeout(() => fn(b.dataset.id), 30); return; }
  fn(b.dataset.id);
});
window.addEventListener('hashchange', () => { window.scrollTo(0,0); render(); });
setInterval(() => { if (!dlg.open && phase === 'app') render(); }, 60000);
render();
boot();
})();
</script>
</body>
